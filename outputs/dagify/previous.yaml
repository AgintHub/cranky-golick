dag_type: plain_text
description: A workflow to diagnose a patient's condition like Dr. House, involving
  gathering information, analyzing symptoms, and determining the underlying cause.
name: diagnose_patient_like_house
nodes:
  analyze_medical_history:
    agent: false
    description: Analyze the patient's medical history for relevant conditions or
      previous illnesses.
    name: analyze_medical_history
    nodes_depended_on:
    - gather_patient_info
    nodes_dependent_on: []
    prompt: Examine the patient's medical history to identify any previous conditions,
      allergies, or treatments that could be relevant to their current symptoms.
  determine_underlying_cause:
    agent: false
    description: Identify the most likely underlying cause of the patient's symptoms
      based on all available information.
    name: determine_underlying_cause
    nodes_depended_on:
    - narrow_differential_diagnosis
    nodes_dependent_on: []
    prompt: Based on the refined differential diagnosis and all other available information,
      determine the most likely underlying cause of the patient's symptoms.
  develop_treatment_plan:
    agent: false
    description: Create a treatment plan tailored to the patient's specific diagnosis
      and needs.
    name: develop_treatment_plan
    nodes_depended_on:
    - determine_underlying_cause
    nodes_dependent_on: []
    prompt: Develop a comprehensive treatment plan addressing the underlying cause
      of the patient's symptoms, including any necessary medications, lifestyle changes,
      or further testing.
  gather_patient_info:
    agent: false
    description: Collect relevant information about the patient, including medical
      history, current symptoms, and lifestyle.
    name: gather_patient_info
    nodes_depended_on: []
    nodes_dependent_on: []
    prompt: Gather detailed information about the patient's medical history, current
      symptoms, lifestyle, and any relevant environmental factors.
  identify_potential_causes:
    agent: false
    description: Determine potential causes for the patient's symptoms based on their
      medical history and current condition.
    name: identify_potential_causes
    nodes_depended_on:
    - list_symptoms
    - analyze_medical_history
    nodes_dependent_on: []
    prompt: Using the patient's symptoms and medical history, generate a list of potential
      underlying causes for their condition.
  interpret_test_results:
    agent: false
    description: Analyze the results of the diagnostic tests to determine their implications
      for the patient's diagnosis.
    name: interpret_test_results
    nodes_depended_on:
    - order_diagnostic_tests
    nodes_dependent_on: []
    prompt: Interpret the results of the diagnostic tests, considering their sensitivity,
      specificity, and any potential biases or confounding factors.
  list_symptoms:
    agent: false
    description: Enumerate the patient's current symptoms.
    name: list_symptoms
    nodes_depended_on:
    - gather_patient_info
    nodes_dependent_on: []
    prompt: List all the symptoms the patient is currently experiencing, including
      their severity and duration.
  narrow_differential_diagnosis:
    agent: false
    description: Refine the differential diagnosis based on the results of the diagnostic
      tests.
    name: narrow_differential_diagnosis
    nodes_depended_on:
    - interpret_test_results
    nodes_dependent_on: []
    prompt: Using the results of the diagnostic tests, refine the list of potential
      causes for the patient's symptoms, prioritizing the most likely diagnoses.
  order_diagnostic_tests:
    agent: false
    description: Recommend diagnostic tests to help determine the underlying cause
      of the patient's symptoms.
    name: order_diagnostic_tests
    nodes_depended_on:
    - identify_potential_causes
    nodes_dependent_on: []
    prompt: Based on the potential causes identified, recommend a set of diagnostic
      tests (e.g., blood work, imaging studies) to help narrow down the diagnosis.
